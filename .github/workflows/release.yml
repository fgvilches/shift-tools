name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Same constraint as CI: macOS runners need a paid plan for private
    # repositories. Set ENABLE_MACOS_CI=true in the repository variables when
    # one is available (or when the repo is public), otherwise a tag push will
    # fail in one second.
    name: Publish .dmg (${{ matrix.label }})
    if: vars.ENABLE_MACOS_CI == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: apple-silicon
            target: aarch64-apple-darwin
          - label: intel
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      # Builds the bundle for this target, signs the updater artifacts and
      # attaches everything to the release for the pushed tag. Both matrix jobs
      # write to the same release; `includeUpdaterJson` merges them into the
      # latest.json the installed app polls.
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "shift-tools v__VERSION__"
          releaseBody: |
            macOS 13+ · Apple silicon and Intel builds below.

            Drag **shift-tools** into `/Applications`. The build is not notarised
            yet, so the first launch needs right-click → Open.

            Installed copies update themselves from the version chip in the
            status bar. Nothing leaves your machine: no telemetry, no analytics.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}
