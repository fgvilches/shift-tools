[package]
name = "shift-tools"
version = "1.0.0"
license = "MIT"
repository = "https://github.com/fgvilches/shift-tools"
authors = ["Felipe González (shift)"]
description = "shift-tools — a macOS Swiss army knife for developers"
edition = "2021"
rust-version = "1.77"

[lib]
name = "shift_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.33"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
  "gzip",
] }
hickory-resolver = "0.24"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
blake3 = "1"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"
walkdir = "2"
once_cell = "1"
libc = "0.2"
objc2 = "0.5"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
x509-parser = "0.16"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
futures-util = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
